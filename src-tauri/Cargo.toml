[package]
name = "mwtyper"
version = "0.1.0"
description = "Local-first Markdown writing tool (Rust + Tauri, Typora-inspired)"
edition = "2021"
license = "MIT"

[lib]
name = "mwtyper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "regex-fancy"] }
rfd = "0.15"
notify = "6"
walkdir = "2"
regex = "1"
chrono = "0.4"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
